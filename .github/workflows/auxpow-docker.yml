name: Build & Publish Multi-Arch Newsatoshi AuxPoW Docker Images (GHCR)

on:
  push:
    branches: [main]
    paths:
      - "auxpow-stratum/**"
      - ".github/workflows/auxpow-docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (arm64 + amd64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch newsatoshi-auxpow-stratum (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: ./auxpow-stratum
          file: ./auxpow-stratum/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/theguysaccount/newsatoshi-auxpow-stratum:v1.2.5
            ghcr.io/theguysaccount/newsatoshi-auxpow-stratum:latest
          labels: |
            org.opencontainers.image.source=https://github.com/theguysaccount/newsatoshi-commons
            org.opencontainers.image.description=Zero-fee Bitcoin + Newsatoshi (LOVE) AuxPoW Stratum v1 merge-mining bridge (chainid=20051)
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=stratum
          cache-to: type=gha,mode=max,scope=stratum

      - name: Build and push multi-arch newsatoshi-node v1.2.5 (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: ./auxpow-stratum
          file: ./auxpow-stratum/Dockerfile.node
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/theguysaccount/newsatoshi-node:v1.2.5
            ghcr.io/theguysaccount/newsatoshi-node:latest
          labels: |
            org.opencontainers.image.source=https://github.com/theguysaccount/newsatoshi-commons
            org.opencontainers.image.description=Canonical Newsatoshi Mainnet v2 (v1.2.5) post-quantum L1 daemon with AuxPoW chainid=20051
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=node
          cache-to: type=gha,mode=max,scope=node
