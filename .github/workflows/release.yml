name: Release Cross-Platform Binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset_suffix }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_suffix: linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_suffix: darwin-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_suffix: darwin-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build release binaries
        run: cargo build --release --bins --target ${{ matrix.target }}
      - name: Package tarball
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/newsatoshi-commons dist/
          cp target/${{ matrix.target }}/release/newsatoshi-swap dist/
          cp target/${{ matrix.target }}/release/newsatoshi-hw-signer dist/
          tar -C dist -czf "newsatoshi-commons-${{ matrix.asset_suffix }}.tar.gz" \
            newsatoshi-commons newsatoshi-swap newsatoshi-hw-signer
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset_suffix }}
          path: newsatoshi-commons-${{ matrix.asset_suffix }}.tar.gz

  publish:
    name: Publish Checksums & Release Assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate SHA256SUMS.txt
        working-directory: artifacts
        run: sha256sum newsatoshi-commons-*.tar.gz > SHA256SUMS.txt
      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" artifacts/newsatoshi-commons-*.tar.gz artifacts/SHA256SUMS.txt --clobber
