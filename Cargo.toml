[package]
name = "newsatoshi-commons"
version = "0.15.1"
edition = "2021"
description = "Newsatoshi 2.1 Autonomous Abundance Loops: NIST FIPS 205 SLH-DSA, Merkleized SHA-256 Lamport signatures, real Winterfell 0.13 STARK covenants, persistent ledger, hardware telemetry signer, trustless BTC-LOVE HTLC swaps, and live L1 seed bridge."

[[bin]]
name = "newsatoshi-commons"
path = "src/main.rs"

[[bin]]
name = "newsatoshi-hw-signer"
path = "src/bin/newsatoshi-hw-signer.rs"

[[bin]]
name = "newsatoshi-swap"
path = "src/bin/newsatoshi-swap.rs"

[dependencies]
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slh-dsa = "0.2.0-rc.5"
winterfell = "0.13.1"
tiny_http = "0.12.0"
ureq = "3.5.2"
