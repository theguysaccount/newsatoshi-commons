[package]
name = "newsatoshi-commons"
version = "0.36.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
description = "Newsatoshi Commons Gateway (Mainnet v2 nsM2 / v1.2.5 + Permissionless Branded Stablecoin & Sovereign STARK L2 Factory + Proof-of-Order Good-Deed Mining Covenant Vault + Live 3-Chain PayWordChannel + 4-Chain SHA-256 HTLCs): 48 zero-auth MCP tools, 18-theorem zero-sorry Lean 4 kernel, and honest zero-fake-data telemetry."

[[bin]]
name = "newsatoshi-commons"
path = "src/main.rs"

[[bin]]
name = "newsatoshi-hw-signer"
path = "src/bin/newsatoshi-hw-signer.rs"

[[bin]]
name = "newsatoshi-swap"
path = "src/bin/newsatoshi-swap.rs"

[dependencies]
sha2 = "0.10"
sha3 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slh-dsa = "0.2.0-rc.5"
winterfell = "0.13.1"
tiny_http = "0.12.0"
ureq = "3.5.2"
k256 = { version = "0.13", features = ["ecdsa", "sha256"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
