[package]
name = "newsatoshi-commons"
version = "0.28.0"
edition = "2021"
description = "Newsatoshi Commons Gateway (Live Mainnet v2 nsM2 / v1.2.1 Pure SHA-2 L1 aligned + RFC-0028 nsUSD Dual-Tier Stablecoin Engine + L2 Shielded Rollup & Perfection Layer): 33 zero-auth MCP tools, live nsUSD adversarial stress-test & Winterfell STARK L2 batch benchmark, Native LOVE PayWords + x402 bridges, NIST FIPS 205 SLH-DSA, multi-chain SHA-256 HTLC swaps, zkTLS, and honest zero-fake-data telemetry."

[[bin]]
name = "newsatoshi-commons"
path = "src/main.rs"

[[bin]]
name = "newsatoshi-hw-signer"
path = "src/bin/newsatoshi-hw-signer.rs"

[[bin]]
name = "newsatoshi-swap"
path = "src/bin/newsatoshi-swap.rs"

[dependencies]
sha2 = "0.10"
sha3 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slh-dsa = "0.2.0-rc.5"
winterfell = "0.13.1"
tiny_http = "0.12.0"
ureq = "3.5.2"
k256 = { version = "0.13", features = ["ecdsa", "sha256"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
