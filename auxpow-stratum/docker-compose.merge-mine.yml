# 1-Command Dual Bitcoin (BTC) + Newsatoshi Mainnet v2 (LOVE) AuxPoW Merge-Mining Kit
#
# Designed for existing Bitcoin pools, CKPool / Public Pool operators, and solo bitcoind node runners.
# Every SHA-256 hash working on Bitcoin simultaneously mines 50 LOVE/block on AuxPoW chainid=20051
# via the standard Namecoin 0xfabe6d6d coinbase tag at $0 extra electricity.
#
# Quickstart:
#   export BTC_RPC_URL="http://host.docker.internal:8332/"
#   export BTC_RPC_AUTH="bitcoinrpc:YOUR_BITCOIND_RPC_PASSWORD"
#   export BTC_PAYOUT_SCRIPT_HEX="0014<your_20byte_p2wpkh_hash>"   # or your pool coinbase scriptPubKey
#   export NS_PAYOUT_ADDRESS="ns1<your_74char_shielded_mainnet_v2_address>"
#   export NS_RPC_AUTH="auxpow:$(openssl rand -hex 16)"
#   docker compose -f docker-compose.merge-mine.yml up -d
#
# Verify dual BTC + LOVE template assembly live:
#   curl -sS http://127.0.0.1:3334/status

services:
  newsatoshi-v2-node:
    image: ghcr.io/theguysaccount/newsatoshi-node:v1.2.5
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: newsatoshi-v2-merge-node
    restart: unless-stopped
    command:
      - "--net"
      - "mainnet-v2"
      - "--datadir"
      - "/data"
      - "node"
      - "--peer"
      - "newsatoshi-seed-v2.fly.dev:8445@b024aaeafa0e4ca384b99483c28c3bedde45a5461a560063b283766414dfbbcc"
      - "--peer"
      - "pool.newsatoshi.org:8445@78187a9436dd2d8cc7ed7afff2396b72b56687099d45d93da676b0a90ed8c6b6"
      - "--rpc"
      - "19556"
      - "--rpcbind"
      - "0.0.0.0"
      - "--rpcauth"
      - "${NS_RPC_AUTH:?Set NS_RPC_AUTH=auxpow:<secret>}"
      - "--status"
      - "8080"
      - "--statusbind"
      - "0.0.0.0"
    ports:
      - "${NS_P2P_PORT:-8445}:8445"
      - "127.0.0.1:8080:8080"
    volumes:
      - newsatoshi-merge-data:/data

  dual-btc-love-stratum:
    image: ghcr.io/theguysaccount/newsatoshi-auxpow-stratum:v1.2.5
    build:
      context: .
      dockerfile: Dockerfile
    container_name: newsatoshi-dual-btc-love-stratum
    restart: unless-stopped
    depends_on:
      - newsatoshi-v2-node
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      STRATUM_BIND: "0.0.0.0"
      STRATUM_PORT: "${STRATUM_PORT:-3333}"
      STATUS_PORT: "${STATUS_PORT:-3334}"
      NS_RPC_URL: "http://newsatoshi-v2-node:19556/"
      NS_RPC_AUTH: "${NS_RPC_AUTH:?Set NS_RPC_AUTH=auxpow:<secret>}"
      NS_PAYOUT_ADDRESS: "${NS_PAYOUT_ADDRESS:?Set NS_PAYOUT_ADDRESS=ns1...}"
      BTC_RPC_URL: "${BTC_RPC_URL:?Set BTC_RPC_URL=http://host.docker.internal:8332/}"
      BTC_RPC_AUTH: "${BTC_RPC_AUTH:?Set BTC_RPC_AUTH=user:pass}"
      BTC_PAYOUT_SCRIPT_HEX: "${BTC_PAYOUT_SCRIPT_HEX:?Set BTC_PAYOUT_SCRIPT_HEX=<scriptPubKey hex>}"
      COINBASE_TAG: "${COINBASE_TAG:-/btc+love-auxpow/}"
      POLL_INTERVAL: "${POLL_INTERVAL:-1.5}"
    ports:
      - "${STRATUM_PORT:-3333}:3333"
      - "127.0.0.1:${STATUS_PORT:-3334}:3334"

volumes:
  newsatoshi-merge-data:
