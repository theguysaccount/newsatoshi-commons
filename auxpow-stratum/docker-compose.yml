# 1-Command Newsatoshi Mainnet v2 (nsM2, v1.2.5) AuxPoW Stratum v1 Solo/Merge-Mining Kit (chainid = 20051)
#
# Quickstart:
#   1. Export NS_PAYOUT_ADDRESS=<your_74char_ns1_address> and NS_RPC_AUTH=auxpow:<strong-secret>
#      (Optional: also set BTC_RPC_URL + BTC_RPC_AUTH + BTC_PAYOUT_SCRIPT_HEX for dual BTC+LOVE merge-mining)
#   2. Run: docker compose up -d
#   3. Point any Bitaxe, NerdQAxe, Antminer S19/S21, WhatsMiner, or Stratum v1 ASIC at:
#        stratum+tcp://<YOUR_HOST>:3333   (worker: <ns1_address>.rig1 or any worker name, password: x or d=65536)
#   4. Inspect real-time mining stats (zero fake data):
#        curl http://127.0.0.1:3334/status

services:
  newsatoshi-node:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: newsatoshi-l1-node
    restart: unless-stopped
    command:
      - "--net"
      - "${NS_NETWORK:-mainnet-v2}"
      - "--datadir"
      - "/data"
      - "node"
      - "--peer"
      - "${NS_SEED_PEER:-newsatoshi-seed-v2.fly.dev:8445@b024aaeafa0e4ca384b99483c28c3bedde45a5461a560063b283766414dfbbcc}"
      - "--rpc"
      - "19556"
      - "--rpcbind"
      - "0.0.0.0"
      - "--rpcauth"
      - "${NS_RPC_AUTH:-auxpow:change-me-before-exposing}"
      - "--status"
      - "8080"
      - "--statusbind"
      - "0.0.0.0"
    ports:
      - "${NS_P2P_PORT:-8445}:8445"
      - "127.0.0.1:8080:8080"
    volumes:
      - newsatoshi-data:/data

  auxpow-stratum:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: newsatoshi-auxpow-stratum
    restart: unless-stopped
    depends_on:
      - newsatoshi-node
    environment:
      STRATUM_BIND: "0.0.0.0"
      STRATUM_PORT: "3333"
      STATUS_PORT: "3334"
      NS_RPC_URL: "http://newsatoshi-node:19556/"
      NS_RPC_AUTH: "${NS_RPC_AUTH:-auxpow:change-me-before-exposing}"
      NS_PAYOUT_ADDRESS: "${NS_PAYOUT_ADDRESS:-}"
      # Optional: connect your own bitcoind for simultaneous BTC + LOVE merge-mining ($0 extra electricity)
      BTC_RPC_URL: "${BTC_RPC_URL:-}"
      BTC_RPC_AUTH: "${BTC_RPC_AUTH:-}"
      BTC_PAYOUT_SCRIPT_HEX: "${BTC_PAYOUT_SCRIPT_HEX:-51}"
      COINBASE_TAG: "${COINBASE_TAG:-/newsatoshi-auxpow/}"
      POLL_INTERVAL: "${POLL_INTERVAL:-2.0}"
    ports:
      - "${STRATUM_PORT:-3333}:3333"
      - "127.0.0.1:${STATUS_PORT:-3334}:3334"

volumes:
  newsatoshi-data:
