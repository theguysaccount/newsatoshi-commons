app = "newsatoshi-pool"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  NS_NETWORK = "mainnet-v2"
  PUBLIC_STRATUM_HOST = "pool.newsatoshi.org"
  COINBASE_TAG = "/pool.newsatoshi.org/"
  POLL_INTERVAL = "2.0"

[mounts]
  source = "newsatoshi_pool_data"
  destination = "/data"

# Public Post-Quantum P2P Port (nsM2 IPv4 + IPv6 seed: pool.newsatoshi.org:8445)
[[services]]
  protocol = "tcp"
  internal_port = 8445
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 8445

# Public Stratum v1 Raw TCP for Bitaxe / NerdQAxe / Antminer / CGMiner
[[services]]
  protocol = "tcp"
  internal_port = 3333
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 3333

# Public HTTPS/HTTP Live Pool Status & Telemetry API (/status)
[[services]]
  protocol = "tcp"
  internal_port = 8080
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    handlers = ["http"]
    port = 80
    force_https = true

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.http_checks]]
    interval = "20s"
    timeout = "5s"
    grace_period = "25s"
    method = "GET"
    path = "/status"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
