<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const params = new URLSearchParams(location.search);
const VERTICAL = params.get('aspect') === '9x16';
if (VERTICAL) document.body.classList.add('vertical');

const W = VERTICAL ? 1080 : 1920;
const H = VERTICAL ? 1920 : 1080;

const clamp01 = (x) => Math.max(0, Math.min(1, x));
const lerp = (a, b, u) => a + (b - a) * u;
const smoothstep = (e0, e1, x) => {
  const t = clamp01((x - e0) / (e1 - e0));
  return t * t * (3 - 2 * t);
};
const easeOutCubic = (x) => { x = clamp01(x); return 1 - Math.pow(1 - x, 3); };
const easeInOutQuart = (x) => { x = clamp01(x); return x < 0.5 ? 8*x*x*x*x : 1 - Math.pow(-2*x+2, 4)/2; };

// Deterministic PRNG so every particle, shard, and grain frame is 100% reproducible!
function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(20051);

// ---------------------------------------------------------------------------
// 1. WebGL2 Renderer + Hardware Metal Verification + Studio Environment
// ---------------------------------------------------------------------------
const canvas = document.getElementById('gl-canvas');
const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true,
  powerPreference: 'high-performance',
  alpha: false,
});
renderer.setSize(W, H, false);
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const gl = renderer.getContext();
const dbgInfo = gl.getExtension('WEBGL_debug_renderer_info');
window.__GPU_INFO = {
  version: gl.getParameter(gl.VERSION),
  renderer: dbgInfo ? gl.getParameter(dbgInfo.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER),
  vendor: dbgInfo ? gl.getParameter(dbgInfo.UNMASKED_VENDOR_WEBGL) : gl.getParameter(gl.VENDOR),
};

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020408);
scene.fog = new THREE.FogExp2(0x02050b, 0.022);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.75;

const camera = new THREE.PerspectiveCamera(VERTICAL ? 52 : 36, W / H, 0.1, 180);
camera.position.set(0, 0, 12);

// Cinematic studio 3-point + dynamic hero lights
const ambLight = new THREE.AmbientLight(0x162438, 0.55);
scene.add(ambLight);

const keyLight = new THREE.DirectionalLight(0xfff5e0, 2.6);
keyLight.position.set(8, 12, 10);
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0x38bdf8, 1.9);
rimLight.position.set(-10, 6, -8);
scene.add(rimLight);

const heroPoint = new THREE.PointLight(0x34d399, 6.0, 42, 1.6);
heroPoint.position.set(0, 0, 0);
scene.add(heroPoint);

const accentPoint = new THREE.PointLight(0xfbbf24, 3.0, 36, 1.6);
accentPoint.position.set(-6, 3, 4);
scene.add(accentPoint);

// ---------------------------------------------------------------------------
// 2. Post-Processing Stack: HalfFloat HDR + UnrealBloom + Cinema Optics Pass
// ---------------------------------------------------------------------------
const rt = new THREE.WebGLRenderTarget(W, H, {
  type: THREE.HalfFloatType,
  samples: 4,
});
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(scene, camera));

const bloomPass = new UnrealBloomPass(new THREE.Vector2(W, H), 0.72, 0.62, 0.76);
composer.addPass(bloomPass);

// Custom GLSL Cinema Optics Pass: Volumetric Radial God-Rays + Chromatic Aberration + Anamorphic Glaze + 35mm Grain + Vignette + Flash
const CinemaOpticsShader = {
  uniforms: {
    tDiffuse: { value: null },
    uTime: { value: 0 },
    uSeed: { value: 0 },
    uChromatic: { value: 0.0012 },
    uGodRay: { value: 0.0 },
    uSunUV: { value: new THREE.Vector2(0.5, 0.5) },
    uFlash: { value: 0.0 },
    uFlashColor: { value: new THREE.Color(0xd1fae5) },
    uVignette: { value: 0.52 },
    uFade: { value: 1.0 },
  },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float uTime;
    uniform float uSeed;
    uniform float uChromatic;
    uniform float uGodRay;
    uniform vec2 uSunUV;
    uniform float uFlash;
    uniform vec3 uFlashColor;
    uniform float uVignette;
    uniform float uFade;
    varying vec2 vUv;

    float hash12(vec2 p) {
      vec3 p3 = fract(vec3(p.xyx) * 0.1031);
      p3 += dot(p3, p3.yzx + 33.33);
      return fract((p3.x + p3.y) * p3.z);
    }

    void main() {
      vec2 dir = vUv - vec2(0.5);
      float dist = length(dir);

      // Velocity-driven radial chromatic aberration
      vec2 ca = dir * uChromatic * (0.6 + dist * 1.8);
      float r = texture2D(tDiffuse, vUv + ca).r;
      float g = texture2D(tDiffuse, vUv).g;
      float b = texture2D(tDiffuse, vUv - ca).b;
      vec3 col = vec3(r, g, b);

      // Screen-space volumetric radial god-rays (dithered 32-tap -> zero concentric banding!)
      if (uGodRay > 0.005) {
        vec2 delta = (vUv - uSunUV) * (1.0 / 34.0) * 0.82;
        float jitter = hash12(gl_FragCoord.xy + vec2(uSeed * 11.7, uSeed * 23.1));
        vec2 suv = vUv - delta * jitter;
        float decay = 1.0;
        vec3 rays = vec3(0.0);
        for (int i = 0; i < 32; i++) {
          suv -= delta;
          vec3 s = texture2D(tDiffuse, clamp(suv, 0.001, 0.999)).rgb;
          float lum = dot(s, vec3(0.2126, 0.7152, 0.0722));
          rays += s * smoothstep(0.68, 1.75, lum) * decay;
          decay *= 0.935;
        }
        col += rays * (uGodRay * 0.022);
      }

      // Subtle horizontal anamorphic highlight glaze
      vec3 anam = vec3(0.0);
      for (int i = -4; i <= 4; i++) {
        vec2 off = vec2(float(i) * 0.0075, 0.0);
        vec3 s = texture2D(tDiffuse, clamp(vUv + off, 0.001, 0.999)).rgb;
        float lum = dot(s, vec3(0.299, 0.587, 0.114));
        anam += s * smoothstep(0.95, 2.2, lum) * (1.0 - abs(float(i)) / 5.0);
      }
      col += anam * vec3(0.22, 0.55, 0.48) * 0.06;

      // Climax white-emerald flash bloom
      col = mix(col, uFlashColor * 1.45, clamp(uFlash, 0.0, 1.0));

      // Subtle deterministic 35mm organic film grain (tuned for clean 1080p60 H.264 compression!)
      float grain = (hash12(gl_FragCoord.xy + vec2(uSeed * 17.3, uSeed * 31.7)) - 0.5) * 0.011;
      col += grain;

      // Smooth optical lens vignette
      float vig = smoothstep(0.96, 0.28, dist * (0.95 + uVignette * 0.45));
      col *= mix(1.0, vig, uVignette);
      col *= uFade;

      gl_FragColor = vec4(max(col, 0.0), 1.0);
    }
  `,
};
const opticsPass = new ShaderPass(CinemaOpticsShader);
composer.addPass(opticsPass);
composer.addPass(new OutputPass());

// ---------------------------------------------------------------------------
// 3. 65,000-PARTICLE GPU CURL-NOISE UNIVERSE (Morphs seamlessly across ALL 7 Shots!)
// ---------------------------------------------------------------------------
const P_COUNT = 65000;
const pPos = new Float32Array(P_COUNT * 3);
const pSeed = new Float32Array(P_COUNT * 3);
const pRand = new Float32Array(P_COUNT);

for (let i = 0; i < P_COUNT; i++) {
  // Spherical seed distribution
  const u = rand() * 2 - 1;
  const th = rand() * Math.PI * 2;
  const rad = Math.cbrt(rand());
  const s = Math.sqrt(1 - u * u);
  pPos[i * 3 + 0] = rad * s * Math.cos(th);
  pPos[i * 3 + 1] = rad * u;
  pPos[i * 3 + 2] = rad * s * Math.sin(th);
  pSeed[i * 3 + 0] = rand() * 2 - 1;
  pSeed[i * 3 + 1] = rand() * 2 - 1;
  pSeed[i * 3 + 2] = rand() * 2 - 1;
  pRand[i] = rand();
}

const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute('aSeed', new THREE.BufferAttribute(pSeed, 3));
pGeo.setAttribute('aRand', new THREE.BufferAttribute(pRand, 1));

const particleUniforms = {
  uTime: { value: 0 },
  uMode: { value: 0 },      // 0..6 shot index
  uLocalT: { value: 0 },    // seconds inside shot
  uKick: { value: 0 },      // 0..1 audio beat pulse
  uVertical: { value: VERTICAL ? 1.0 : 0.0 },
  uPixelRatio: { value: 1.0 },
};

const particleMat = new THREE.ShaderMaterial({
  uniforms: particleUniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    attribute vec3 aSeed;
    attribute float aRand;
    uniform float uTime;
    uniform float uMode;
    uniform float uLocalT;
    uniform float uKick;
    uniform float uVertical;
    uniform float uPixelRatio;
    varying vec3 vColor;
    varying float vAlpha;

    // Fast 3D curl-like trig turbulence
    vec3 curlField(vec3 p, float t) {
      return vec3(
        sin(p.y * 1.7 + t * 1.1) + cos(p.z * 1.3 - t * 0.9),
        sin(p.z * 1.6 + t * 0.8) + cos(p.x * 1.5 + t * 1.2),
        sin(p.x * 1.4 - t * 1.0) + cos(p.y * 1.8 + t * 0.7)
      );
    }

    void main() {
      vec3 pos = position * 12.0;
      vec3 col = vec3(0.20, 0.85, 0.60);
      float alpha = 0.45;
      float size = mix(1.4, 4.4, aRand);

      if (uMode < 0.5) {
        // SHOT 1: Frozen Vault — obsidian motes + VIVID golden ribbon ripped into crimson ash at 6.6s!
        float leak = smoothstep(6.2, 7.6, uLocalT);
        if (aRand < 0.42 && leak > 0.01) {
          float u = fract(aSeed.x * 0.5 + 0.5 + uLocalT * 0.24);
          float x = mix(1.2, 8.8, u);
          vec3 turb = curlField(vec3(x * 0.7, aSeed.y * 2.4, aSeed.z * 2.4), uTime * 1.9);
          pos = vec3(x, aSeed.y * 0.55 + turb.y * u * 1.55, aSeed.z * 0.55 + turb.z * u * 1.35);
          col = mix(vec3(1.45, 1.05, 0.22), vec3(1.55, 0.16, 0.34), smoothstep(0.10, 0.58, u));
          alpha = leak * (1.0 - u * 0.45) * 0.98;
          size = mix(3.4, 7.8, aRand * 2.4);
        } else {
          pos = position * vec3(14.0, 10.0, 14.0) + curlField(position * 2.5, uTime * 0.22) * 0.45;
          col = mix(vec3(0.38, 0.48, 0.65), vec3(1.25, 0.88, 0.26), step(0.76, aRand));
          alpha = 0.38 * (1.0 - smoothstep(11.05, 11.2, uLocalT));
          size = mix(2.0, 5.0, aRand);
        }
      } else if (uMode < 1.5) {
        // SHOT 2: Awakening — EXPLOSIVE shockwave ignition -> swirling bioluminescent Living Core vortex!
        float expT = max(0.0, uLocalT);
        float burst = 1.0 - exp(-expT * 3.8);
        float ang = atan(position.z, position.x) + expT * (0.8 + aRand * 0.9);
        float r = mix(0.6, 13.5, pow(aRand, 0.65)) * (0.35 + burst * 1.05);
        float spiralY = position.y * 7.5 * (0.4 + burst * 0.7) + sin(ang * 3.0 + uTime * 2.0) * 0.8;
        pos = vec3(cos(ang) * r, spiralY, sin(ang) * r) + curlField(position * 3.0, uTime * 0.9) * 0.55;
        col = mix(vec3(0.08, 0.92, 0.58), vec3(0.22, 0.76, 0.98), aSeed.y * 0.5 + 0.5);
        if (aRand > 0.88) col = vec3(0.98, 0.86, 0.42);
        alpha = (0.35 + 0.55 * exp(-expT * 0.45)) * (0.75 + uKick * 0.5);
        size = mix(1.8, 6.2, aRand) * (1.0 + uKick * 0.35);
      } else if (uMode < 2.5) {
        // SHOT 3: Conscience — luminous emerald orbital streams around the Möbius conduit + shield sparks!
        float ang = aRand * 6.28318 * 4.0 + uTime * 0.85;
        float p = 2.0, q = 3.0;
        float rr = 2.5 + 0.85 * cos(q * ang);
        vec3 knot = vec3(rr * cos(p * ang), rr * sin(p * ang), 0.95 * sin(q * ang));
        if (aRand < 0.62) {
          pos = knot + aSeed * 0.55;
          col = mix(vec3(0.15, 0.92, 0.62), vec3(0.22, 0.78, 0.98), fract(aRand * 7.0));
          alpha = 0.62;
        } else {
          pos = position * vec3(18.0, 12.0, 14.0) + curlField(position * 2.0, uTime * 0.4) * 0.6;
          col = vec3(0.15, 0.65, 0.85);
          alpha = 0.22;
        }
        // Rogue crimson spark shower around shield repel (uLocalT ~ 4.35s)
        float repel = exp(-pow((uLocalT - 4.35) * 2.8, 2.0));
        if (aRand > 0.82 && repel > 0.05) {
          pos = vec3(3.1, 0.5, 0.2) + aSeed * (0.4 + (uLocalT - 4.0) * 3.8);
          col = mix(vec3(0.98, 0.24, 0.38), vec3(0.20, 0.96, 0.65), aRand);
          alpha = repel * 0.95;
          size = 5.5;
        }
      } else if (uMode < 3.5) {
        // SHOT 4: Abundance — glowing terrain fireflies + SUPERSONIC CYAN PAYWORD LASER RAIN!
        float rainOn = smoothstep(3.8, 4.6, uLocalT);
        if (aRand < 0.45 && rainOn > 0.01) {
          // Supersonic electric-cyan PayWord vertical streaks raining onto terrain!
          float fall = fract(aSeed.y * 0.5 + 0.5 - uLocalT * (1.2 + aRand * 1.4));
          float x = aSeed.x * 16.0;
          float z = aSeed.z * 16.0;
          pos = vec3(x, mix(-1.8, 12.0, fall), z);
          col = mix(vec3(0.18, 0.82, 1.0), vec3(0.45, 0.98, 0.82), fall);
          alpha = rainOn * (0.45 + 0.55 * (1.0 - fall));
          size = mix(2.5, 6.2, aRand * 2.0);
        } else {
          // Bioluminescent emerald & gold motes rising from basalt landscape
          float x = aSeed.x * 20.0;
          float z = aSeed.z * 20.0;
          float rise = fract(aRand + uLocalT * 0.14);
          pos = vec3(x, -2.2 + rise * 7.0, z);
          col = mix(vec3(0.10, 0.86, 0.55), vec3(0.98, 0.78, 0.24), step(0.75, aRand));
          alpha = 0.42 * sin(rise * 3.14159);
        }
      } else if (uMode < 4.5) {
        // SHOT 5: Blind Bitcoin Fortress — ROARING GOLDEN SHA-256 RIVER splitting into twin Gold & Emerald corridors!
        float u = fract(aSeed.x * 0.5 + 0.5 + uLocalT * (0.45 + aRand * 0.35));
        float spread = aSeed.y * 0.55;
        float zOff = aSeed.z * 0.75;
        if (u < 0.44) {
          // Incoming molten gold SHA-256 plasma stream
          float tIn = u / 0.44;
          float x = mix(-14.0, -0.4, tIn);

  for (const s of STRIKES) {

    const fout = 1.0 - smoothstep(active.t1 - 0.22, active.t1, t);
    const op = clamp01(Math.min(fin, fout));
    const blur = (1.0 - fin) * 14.0 + (1.0 - fout) * 8.0;

    heroEl.style.fontSize = `${fz}px`;
    heroEl.style.top = active.y;
    heroEl.style.transform = `translateY(-50%) scale(${sc.toFixed(4)})`;

    heroEl.innerHTML = active.html + (active.sub ? `<span class="title-micro">${active.sub}</span>` : '');
  } else {
    heroEl.style.opacity = '0';

  // Shot 6 floating river whispers (0:44.45 -> 0:46.75)

      el.style.opacity = rOp.toFixed(3);
      el.style.left = pos[k][0];
      el.style.top = pos[k][1];

    for (const el of Object.values(riverEls)) el.style.opacity = '0';

  // Shot 7 Live Mainnet Telemetry (0:49.0 -> 0:52.7) — 100% REAL LIVE STATS!
  const telOp = smoothstep(49.00, 49.65, t) * (1.0 - smoothstep(52.10, 52.65, t));

    // Flash decay out of the 0:48.387 climax impact!
    flash = Math.exp(-lt * 5.2) * 0.92;
    godRay = 0.55 + Math.exp(-lt * 2.2) * 0.9;
    chromatic = 0.0008 + Math.exp(-lt * 4.5) * 0.006;
    bloomStr = 0.72 + kick * 0.42;
    heroPoint.position.set(0, monoY, 1.2);
    heroPoint.color.setHex(0x34d399);
    heroPoint.intensity = 9.0 + kick * 5.5;
  }

  // Update post-processing optics uniforms
  bloomPass.strength = bloomStr;
  opticsPass.uniforms.uTime.value = t;
  opticsPass.uniforms.uSeed.value = frameIdx;
  opticsPass.uniforms.uChromatic.value = chromatic;
  opticsPass.uniforms.uGodRay.value = godRay;
  opticsPass.uniforms.uFlash.value = flash;
  opticsPass.uniforms.uFade.value = fade;

  composer.render();
  updateTypography(t, payload.stats);
};

window.__CINEMA_READY = true;
</script>
