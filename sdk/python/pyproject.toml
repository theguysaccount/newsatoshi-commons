[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newsatoshi-402"
version = "0.14.0"
description = "Zero-dependency post-quantum HTTP 402 PayWord, x402, zero-API-key EVM/BTC/BOLT-11/Uniswap V3 crypto tools, and Streamable HTTP MCP client/middleware for Newsatoshi (LOVE)"
readme = "../../README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Newsatoshi Commons", email = "commons@newsatoshi.org" }]
keywords = ["newsatoshi", "http-402", "payword", "mcp", "ai-agents", "post-quantum", "micropayments"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Security :: Cryptography",
]

[project.urls]
Homepage = "https://commons.newsatoshi.org"
Repository = "https://github.com/theguysaccount/newsatoshi-commons"

[tool.setuptools]
py-modules = ["newsatoshi_402"]
