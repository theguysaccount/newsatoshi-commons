[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newsatoshi-402"
version = "0.30.0"
description = "Zero-dependency post-quantum HTTP 402 PayWord (L1 LOVE + Live Base Mainnet USDC PayWordChannel & FairCurvePool), x402, zero-API-key EVM/BTC/BOLT-11/Uniswap V3 crypto tools, and Streamable HTTP MCP client/middleware for Newsatoshi"
readme = "../../README.md"
requires-python = ">=3.9"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "Newsatoshi Commons", email = "contributors@newsatoshi.org" }]
keywords = ["newsatoshi", "http-402", "payword", "base", "usdc", "x402", "mcp", "ai-agents", "post-quantum", "micropayments"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Security :: Cryptography",
]

[project.urls]
Homepage = "https://commons.newsatoshi.org"
Repository = "https://github.com/theguysaccount/newsatoshi-commons"

[tool.setuptools]
py-modules = ["newsatoshi_402"]
