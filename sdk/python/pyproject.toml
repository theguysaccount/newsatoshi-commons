[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newsatoshi-402"
version = "0.37.0"
description = "Zero-dependency multi-chain HTTP 402 PayWord & AI Agent AutoPaySession SDK, Universal Interoperability Layer (ERC-7683, 11-rail SHA-256 HTLC, ISO 20022 pacs.008), Branded Stablecoin & Sovereign STARK L2 Factory, Proof-of-Order Good-Deed Vault, and 52-tool Streamable HTTP MCP client"
readme = "../../README.md"
requires-python = ">=3.9"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "Newsatoshi Commons", email = "contributors@newsatoshi.org" }]
keywords = ["newsatoshi", "http-402", "payword", "base", "usdc", "x402", "mcp", "ai-agents", "post-quantum", "micropayments"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Security :: Cryptography",
]

[project.urls]
Homepage = "https://commons.newsatoshi.org"
Repository = "https://github.com/theguysaccount/newsatoshi-commons"

[tool.setuptools]
py-modules = ["newsatoshi_402"]
